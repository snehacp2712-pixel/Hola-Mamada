<!DOCTYPE html>
<html>
<head>
    <title>My Surprise</title>
</head>

<body>
    <h1>You've got a surprise! 🎁</h1>

    <p>Click the button below.</p>

    <button onclick="revealMessage()">Open Surprise</button>

    <div id="surprise" style="display: none;">
        <h2>😂 I KNOW YOU HAVE A HULK INSIDE YOUR PANT!</h2>

        <img src="eee.jpg" alt="Surprise"
             style="max-width: 500px; width: 100%;">

    </div>

    <script>
        function revealMessage() {
            document.getElementById("surprise").style.display = "block";
        }
    </script>
</body>
</html>
